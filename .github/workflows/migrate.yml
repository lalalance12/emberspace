name: Apply migrations

# Runs `pnpm db:migrate` against the production Neon database whenever a
# migration lands on main.
#
# Vercel deploys the app on the same push, and the two are independent — this
# job and that build start at roughly the same moment. Migrations here are
# additive (new nullable columns, new functions, new enum values), so a deploy
# that briefly runs ahead of its schema degrades rather than breaks. If a change
# is ever destructive — dropping a column the running app still selects — do it
# by hand and in two steps instead of relying on this.
#
# scripts/migrate.mjs applies only what is missing, tracked in
# public.schema_migrations, so a re-run is always safe.
#
# Needs one repository secret, DATABASE_URL: the production branch's
# connection string. Use the unpooled one (DATABASE_URL_UNPOOLED in Vercel) —
# migrations are long transactions and belong on a direct connection, not the
# pooler. Never the dev branch's: the seed and its shared password live there.

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "scripts/migrate.mjs"
  # Lets you re-run a failed apply without an empty commit.
  workflow_dispatch:

# One at a time. Two pushes in quick succession must not race each other into
# the same database.
concurrency:
  group: neon-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.13.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Only pg is needed, but the lockfile installs as a whole.
      - run: pnpm install --frozen-lockfile

      - name: Apply
        run: pnpm db:migrate
